name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install YouTube metadata extractor
        run: python -m pip install -r scripts/requirements.txt

      - name: Restore last verified YouTube releases
        uses: actions/cache@v4
        with:
          path: src/data/youtube.json
          key: youtube-releases-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: youtube-releases-

      - name: Refresh long-form YouTube releases
        run: python scripts/refresh_youtube.py

      - name: Check releases and source
        run: |
          npm run test:videos
          npm run lint

      - name: Build
        env:
          VITE_INQUIRY_ENDPOINT: ${{ vars.VITE_INQUIRY_ENDPOINT }}
        run: npm run build

      - name: Check SEO and internal links
        run: npm run check:seo

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
